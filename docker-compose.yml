services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalog_metadata_app
    container_name: catalog_metadata_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    networks:
      - catalog_network
    depends_on:
      - mysql
      - redis

  web:
    image: nginx:alpine
    container_name: catalog_metadata_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - catalog_network
    depends_on:
      - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalog_metadata_app
    container_name: catalog_metadata_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=600
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    networks:
      - catalog_network
    depends_on:
      - mysql
      - redis
      - app

  schedule:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalog_metadata_app
    container_name: catalog_metadata_schedule
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    networks:
      - catalog_network
    depends_on:
      - mysql
      - redis
      - app

  mysql:
    image: mysql:8.0
    container_name: catalog_metadata_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-catalog_metadata}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${DB_USERNAME:-catalog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - catalog_mysql_data:/var/lib/mysql
    networks:
      - catalog_network

  redis:
    image: redis:alpine
    container_name: catalog_metadata_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - catalog_redis_data:/data
    networks:
      - catalog_network
    command: redis-server --appendonly yes

networks:
  catalog_network:
    driver: bridge

volumes:
  catalog_mysql_data:
  catalog_redis_data: