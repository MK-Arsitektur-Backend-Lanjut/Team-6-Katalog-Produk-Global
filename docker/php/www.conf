; ============================================================
; PHP-FPM Pool Configuration — Enterprise Scale (1000 VU)
; ============================================================
;
; Kenapa perlu tuning ini:
; Default PHP-FPM hanya punya pm.max_children = 5.
; Dengan 1000 concurrent VU, 995 request langsung antri dan
; timeout → "connection reset by peer" / EOF di k6.
;
; Formula pm.max_children untuk server lokal (RAM ~8-16 GB):
;   Tiap PHP-FPM worker ≈ 30-50 MB RAM
;   Max children = free RAM / avg worker size
;   Contoh: 2048 MB / 40 MB ≈ 50 workers
;
; Kita set 100 untuk absorb 1000 VU dengan antrian wajar.
; ============================================================

[www]
user  = www-data
group = www-data

; Mode static: langsung fork sejumlah worker yang ditentukan.
; Lebih predictable dan cepat daripada dynamic untuk beban tinggi.
pm                      = static
pm.max_children         = 100

; Timeout tiap request PHP (sesuaikan dengan fastcgi_read_timeout Nginx)
request_terminate_timeout = 300

; Agar worker lama yang mungkin memory-leak di-recycle secara berkala
pm.max_requests         = 500

; Log slow request (request > 5 detik dicatat untuk analisis)
slowlog                 = /var/www/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 5s

; Status page untuk monitoring (opsional)
pm.status_path          = /fpm-status
