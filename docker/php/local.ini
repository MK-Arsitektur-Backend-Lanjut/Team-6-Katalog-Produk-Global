[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
memory_limit = 512M
max_execution_time = 300

; ── OPcache tuning untuk high-concurrency ──────────────────────────────────
; Tanpa OPcache: PHP parse & compile ulang setiap file .php di setiap request.
; Dengan OPcache: compiled bytecode disimpan di shared memory → tidak re-parse.
; Efek: -20 hingga -50ms overhead PHP per request, sangat signifikan di 1000 VU.
[opcache]
opcache.enable=1
opcache.enable_cli=1
; Memory 256MB untuk muat semua bytecode Laravel (default 128MB sering penuh)
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
; Muat maksimal 10.000 file (Laravel + vendor)
opcache.max_accelerated_files=10000
; Interval revalidasi 60 detik (tidak perlu cek file system setiap request)
opcache.revalidate_freq=60
; Di production: matikan validate timestamps agar tidak cek mtime file setiap hit
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1
